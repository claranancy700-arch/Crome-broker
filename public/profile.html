<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile & Settings — Sand Box</title>
  <link rel="stylesheet" href="/css/dashboard.css" />
  <style>
    .settings-container{max-width:680px;margin:28px auto;padding:24px}
    .settings-card{background:rgba(255,255,255,0.02);padding:24px;border-radius:12px;border:1px solid rgba(255,255,255,0.06);margin-bottom:20px}
    .settings-card h3{margin-top:0;margin-bottom:16px}
    .form-group{margin-bottom:18px}
    .form-group label{display:block;margin-bottom:6px;font-weight:600;color:var(--white)}
    .form-group input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:var(--white)}
    .btn-group{display:flex;gap:10px;margin-top:20px}
    .info-text{color:var(--muted);font-size:0.9rem;margin-top:8px}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="logo.png" class="logo" alt="Sand Box logo" />
      </div>
      <nav class="nav">
        <a href="/dashboard" class="nav-item">Overview</a>
        <a href="/market" class="nav-item">Market</a>
        <a href="/portfolio" class="nav-item">Portfolio</a>
        <a href="/orders" class="nav-item">Orders</a>
        <a href="/reports" class="nav-item">Reports</a>
        <a href="/profile" class="nav-item active">Profile</a>
        <a href="#" class="nav-item" data-logout>Sign out</a>
      </nav>
      <button id="sidebarToggle" class="sidebar-toggle">⟨</button>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="left">
          <button id="menuToggle" class="icon-btn">☰</button>
          <h1 class="page-title">Profile & Settings</h1>
        </div>
        <div class="right">
          <div class="user">
            <div class="user-name">Hi, <span id="userName">User</span></div>
          </div>
        </div>
      </header>

      <div class="settings-container">
        <!-- Personal Info -->
        <div class="settings-card">
          <h3>Personal Information</h3>
          <form id="profileForm">
            <div class="form-group">
              <label for="name">Full Name</label>
              <input type="text" id="name" name="name" required />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" disabled />
              <p class="info-text">Email cannot be changed</p>
            </div>
            <div class="btn-group">
              <button type="submit" class="btn primary">Update Profile</button>
            </div>
          </form>
        </div>

        <!-- Change Password -->
        <div class="settings-card">
          <h3>Change Password</h3>
          <form id="passwordForm">
            <div class="form-group">
              <label for="currentPassword">Current Password</label>
              <input type="password" id="currentPassword" name="currentPassword" required />
            </div>
            <div class="form-group">
              <label for="newPassword">New Password</label>
              <input type="password" id="newPassword" name="newPassword" required />
              <p class="info-text">Minimum 8 characters</p>
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm New Password</label>
              <input type="password" id="confirmPassword" name="confirmPassword" required />
            </div>
            <div class="btn-group">
              <button type="submit" class="btn primary">Change Password</button>
            </div>
          </form>
        </div>

        <!-- Account Info -->
        <div class="settings-card">
          <h3>Account Information</h3>
          <p><strong>Account ID:</strong> <span id="userId">—</span></p>
          <p><strong>Member Since:</strong> <span id="memberSince">—</span></p>
          <p><strong>Current Balance:</strong> <span id="balance">$0</span></p>
        </div>
      </div>

      <footer class="site-footer">
        <small>© <span id="year"></span> Sand Box Investment Broker</small>
      </footer>
    </div>
  </div>

  <script src="/js/toast.js"></script>
  <script src="/js/loading.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/logout.js"></script>
  <script>
    (function() {
      'use strict';
      
      const user = auth.getUser();
      if (user) {
        document.getElementById('userName').textContent = user.name;
        document.getElementById('name').value = user.name;
        document.getElementById('email').value = user.email;
        document.getElementById('userId').textContent = user.id;
      }

      // Load account info
      async function loadAccountInfo() {
        try {
          const response = await auth.apiRequest(`/api/account?email=${encodeURIComponent(user.email)}`);
          const data = await response.json();
          if (data.user) {
            document.getElementById('balance').textContent = '$' + Number(data.user.balance || 0).toLocaleString();
            if (data.user.created_at) {
              const date = new Date(data.user.created_at);
              document.getElementById('memberSince').textContent = date.toLocaleDateString();
            }
          }
        } catch (err) {
          console.error('Failed to load account info:', err);
        }
      }
      
      loadAccountInfo();

      // Profile form
      document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        
        if (!name) {
          toast.error('Name is required');
          return;
        }

        const btn = e.target.querySelector('button[type="submit"]');
        loading.button(btn, true);

        try {
          const response = await auth.apiRequest('/api/profile', {
            method: 'PUT',
            body: JSON.stringify({ name })
          });
          
          const data = await response.json();
          
          if (response.ok) {
            toast.success('Profile updated successfully');
            auth.setUser(data.user);
            document.getElementById('userName').textContent = data.user.name;
          } else {
            toast.error(data.error || 'Failed to update profile');
          }
        } catch (err) {
          toast.error(err.message || 'Failed to update profile');
        } finally {
          loading.button(btn, false);
        }
      });

      // Password form
      document.getElementById('passwordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
          toast.error('New passwords do not match');
          return;
        }

        if (newPassword.length < 8) {
          toast.error('Password must be at least 8 characters');
          return;
        }

        const btn = e.target.querySelector('button[type="submit"]');
        loading.button(btn, true);

        try {
          const response = await auth.apiRequest('/api/profile', {
            method: 'PUT',
            body: JSON.stringify({ currentPassword, newPassword })
          });
          
          const data = await response.json();
          
          if (response.ok) {
            toast.success('Password changed successfully');
            document.getElementById('passwordForm').reset();
          } else {
            toast.error(data.error || 'Failed to change password');
          }
        } catch (err) {
          toast.error(err.message || 'Failed to change password');
        } finally {
          loading.button(btn, false);
        }
      });

      // Sidebar toggle
      const sidebar = document.getElementById('sidebar');
      const sidebarToggle = document.getElementById('sidebarToggle');
      const menuToggle = document.getElementById('menuToggle');
      sidebarToggle && sidebarToggle.addEventListener('click', () => sidebar.classList.toggle('collapsed'));
      menuToggle && menuToggle.addEventListener('click', () => sidebar.classList.toggle('collapsed'));

      document.getElementById('year').textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
