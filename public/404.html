<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Page Not Found — Sand Box</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="page-main">
    <div class="form-page">
      <section class="error-container auth-container">
        <div class="error-code">404</div>
        <div style="font-size:1.25rem;font-weight:800;margin-bottom:12px">Page Not Found</div>
        <p class="muted" style="margin-bottom:24px;line-height:1.6">
          The page you're looking for doesn't exist or has been moved.
        </p>
        <div class="error-actions">
          <a href="/" class="btn primary">Go Home</a>
          <a href="/login" class="btn">Sign In</a>
          <a href="/dashboard" class="btn">Dashboard</a>
        </div>
      </section>
    </div>
    <footer class="site-footer">
      <small>© <span id="year"></span> Sand Box Investment Broker</small>
    </footer>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
</body>
</html>
