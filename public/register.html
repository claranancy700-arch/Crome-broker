<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Register — Sand Box</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="page-main">
    <div class="form-page">
      <div class="auth-container">
        <h2>Create an account</h2>
        <p class="muted">Create your account to get started.</p>
        <form id="registerForm" autocomplete="off" novalidate>
          <div class="row">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" required autocomplete="name" />
          </div>
          <div class="row">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email" />
          </div>
          <div class="row">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password" />
          </div>
          <div class="row">
            <label for="confirm">Confirm password</label>
            <input id="confirm" name="confirm" type="password" minlength="8" required autocomplete="new-password" />
          </div>
          <div class="actions">
            <button type="submit" class="btn primary">Register</button>
            <a href="/login" class="btn">Sign in</a>
          </div>
          <div id="message" class="msg" role="status"></div>
        </form>
      </div>
    </div>
    <footer class="site-footer">
      <small>© <span id="year"></span> Sand Box Investment Broker</small>
    </footer>
  </main>

  <script src="/js/money.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/register.js" defer></script>
</body>
</html>
