<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Processing withdrawal — Sand Box</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="page-main">
    <div class="form-page">
      <div class="proc-wrap">
        <h2>Processing withdrawal</h2>
        <p class="muted" id="txInfo">Preparing your withdrawal...</p>
        <div class="progress" aria-hidden="true"><i id="bar"></i></div>
        <div class="pct" id="pct">0%</div>

        <div class="actions" style="justify-content:center">
          <button id="cancelBtn" class="btn" type="button">Cancel</button>
          <a href="/dashboard" class="btn small">Dashboard</a>
        </div>
        <p class="muted" id="statusLine"><span class="spinner" id="spinner"></span>Connecting…</p>
      </div>
    </div>
  </main>

  <script src="/js/money.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/withdraw-processing.js" defer></script>
</body>
</html>
