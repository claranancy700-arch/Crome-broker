<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Deposit — Sand Box</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="page-main">
    <div class="form-page">
      <div class="auth-container">
        <h2>Make a deposit</h2>
        <p class="muted">Credits your balance. Signed in as <span id="accountLabel">…</span></p>

        <form id="depositForm" autocomplete="off" novalidate>
          <div class="row">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" readonly />
          </div>
          <div class="row">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" readonly />
          </div>
          <div class="row">
            <label for="amount">Amount (USD)</label>
            <input id="amount" name="amount" type="number" step="0.01" min="0.01" required inputmode="decimal" placeholder="1000.00" />
          </div>
          <div class="row">
            <label for="note">Note (optional)</label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>
          <div class="actions">
            <button type="submit" class="btn primary">Deposit</button>
            <a href="/dashboard" class="btn">Cancel</a>
          </div>
          <div id="message" class="msg" role="status"></div>
        </form>
      </div>
    </div>
    <footer class="site-footer">
      <small>© <span id="year"></span> Sand Box Investment Broker</small>
    </footer>
  </main>

  <script src="/js/money.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/logout.js" defer></script>
  <script src="/js/deposit.js" defer></script>
</body>
</html>
