<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Login — Sand Box</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="page-main">
    <div class="form-page">
      <div class="auth-container">
        <h2>Sign in</h2>
        <p class="muted">Sign in to your account.</p>
        <form id="loginForm" autocomplete="off" novalidate>
          <div class="row">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="username" />
          </div>
          <div class="row">
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input id="password" name="password" type="password" required autocomplete="current-password" />
              <button type="button" id="pwToggle" class="pw-toggle" aria-pressed="false" aria-label="Show password">👁️</button>
            </div>
          </div>
          <div class="actions">
            <button type="submit" class="btn primary">Sign in</button>
            <a href="/register" class="btn">Create account</a>
          </div>
          <div id="message" class="msg" role="status"></div>
        </form>
      </div>
    </div>
    <footer class="site-footer">
      <small>© <span id="year"></span> Sand Box Investment Broker</small>
    </footer>
  </main>

  <script src="/js/money.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/loading.js"></script>
  <script src="/js/login.js" defer></script>
</body>
</html>
