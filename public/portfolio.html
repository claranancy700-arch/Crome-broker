<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Portfolio — Sand Box</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="page-main">
    <header class="page-header">
      <h1>Portfolio</h1>
      <div class="page-header__actions">
        <a class="btn" href="/dashboard">Dashboard</a>
        <a class="btn" href="/market">Market</a>
      </div>
    </header>

    <div class="page-shell">
      <section class="panel ui-card">
        <div class="stat-row">
          <div class="stat-block">
            <div class="metric-label">Account</div>
            <div id="owner" class="metric--sm">—</div>
          </div>
          <div class="stat-block stat-block--end">
            <div class="metric-label">Total value <span class="muted" style="font-weight:500;text-transform:none;letter-spacing:0">(account balance)</span></div>
            <div id="totalValue" class="metric">$0.00</div>
          </div>
        </div>

        <div class="table-scroll">
          <table id="holdingsTable" aria-live="polite">
            <thead>
              <tr>
                <th>Asset</th>
                <th class="num">Qty</th>
                <th class="num">Avg price</th>
                <th class="num">Market</th>
                <th class="num">Value</th>
                <th class="num">P/L</th>
              </tr>
            </thead>
            <tbody id="holdingsBody">
              <tr><td colspan="6" class="empty">Loading portfolio…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <footer class="site-footer">
      <small>© <span id="year"></span> Sand Box</small>
    </footer>
  </main>

  <script src="/js/money.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/logout.js" defer></script>
  <script src="/js/portfolio.js" defer></script>
</body>
</html>
