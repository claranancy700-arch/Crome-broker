<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Market — Sand Box</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="page-main">
    <header class="page-header">
      <h1>Market</h1>
    </header>

    <div class="market-wrap">
      <div class="panel tv-container" id="tv_chart"></div>
      <div class="right-col">
        <section class="panel">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
            <h3 style="margin:0">Watchlist</h3>
            <div class="controls">
              <input id="addSymbol" placeholder="e.g. BTC" />
              <button id="addBtn" class="btn small" type="button">Add</button>
            </div>
          </div>
          <div id="alertsBanner"></div>
          <div class="watchlist" id="watchlist"></div>
          <div class="muted" style="margin-top:8px">Alerts use localStorage & Notification API.</div>
        </section>

        <section class="panel">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
            <h3 style="margin:0">Correlation (7d)</h3>
            <select id="corrCount">
              <option value="5">Top 5</option>
              <option value="8">Top 8</option>
            </select>
          </div>
          <div id="corrMatrix" style="margin-top:12px"></div>
          <h4 style="margin-top:12px;font-size:0.95rem">Trade Ideas</h4>
          <ul id="ideas" class="ideas"></ul>
        </section>

        <section class="panel">
          <h3 style="margin:0 0 8px">Micro order-book</h3>
          <div class="controls" style="margin-bottom:8px">
            <select id="depthSymbol" style="flex:1"></select>
            <button id="depthToggle" class="btn small" type="button">Connect</button>
          </div>
          <canvas id="depthCanvas" class="depth-canvas"></canvas>
          <div class="muted" id="depthMeta"></div>
        </section>

        <section class="panel">
          <h3 style="margin:0 0 8px">On-chain timeline</h3>
          <div class="timeline" id="timeline">
            <div class="muted">Loading chain updates…</div>
          </div>
        </section>
      </div>
    </div>

    <footer class="site-footer">
      <small>© <span id="year"></span> Sand Box</small>
    </footer>
  </main>

  <script src="/js/money.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/logout.js" defer></script>
  <script src="https://s3.tradingview.com/tv.js"></script>
  <script src="/js/market-extended.js" defer></script>
</body>
</html>
