<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Dashboard — Sand Box</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <main class="page-main">
    <header class="page-header dash-top">
      <h1>
        Overview
      </h1>
      <div class="page-header__actions dash-actions">
        <span class="muted">Hello, <span id="userName" class="user-badge">…</span></span>
        <a id="depositBtn" class="btn primary" href="/deposit">Deposit</a>
        <a id="withdrawBtn" class="btn" href="/withdraw">Withdraw</a>
      </div>
    </header>

    <section class="grid">
      <article class="card balance card-anim">
        <h3>Account balance</h3>
        <div class="balance-amount metric" id="balance">$0.00</div>
        <div class="balance-meta metric-label">Updated <span id="lastUpdate">—</span></div>
      </article>

      <article class="card portfolio card-anim">
        <h3>Portfolio snapshot</h3>
        <div class="portfolio-visual">
          <div class="donut" id="donut" aria-hidden="true"></div>
          <div class="legend">
            <div><span class="pill a"></span> Crypto</div>
            <div><span class="pill b"></span> Equities</div>
            <div><span class="pill c"></span> Cash</div>
          </div>
        </div>
        <p class="muted portfolio-link"><a href="/portfolio">View full portfolio →</a></p>
      </article>

      <article class="card sparkline card-anim">
        <h3>Activity sparkline</h3>
        <svg id="spark" viewBox="0 0 200 40" preserveAspectRatio="none" class="spark-svg" aria-hidden="true">
          <path id="sparkPath" d="" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <div class="spark-meta">
          <span id="price" class="metric--sm">$0.00</span>
          <small id="priceChange" class="muted">—</small>
        </div>
      </article>

      <section class="transactions card card-anim">
        <h3>Recent transactions</h3>
        <ul id="txList" class="tx-list" aria-live="polite"></ul>
      </section>
    </section>

    <footer class="site-footer">
      <small>© <span id="year"></span> Sand Box</small>
    </footer>
  </main>

  <script src="/js/money.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/logout.js" defer></script>
  <script src="/js/dashboard.js" defer></script>
</body>
</html>
