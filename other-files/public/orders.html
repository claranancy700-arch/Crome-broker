<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Orders — Sand Box</title>
  <link rel="stylesheet" href="/css/dashboard.css" />
  <style>
    .orders-container{max-width:1000px;margin:28px auto;padding:24px}
    .orders-table{width:100%;background:rgba(255,255,255,0.02);border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.06)}
    .orders-table table{width:100%;border-collapse:collapse}
    .orders-table th{padding:14px;text-align:left;background:rgba(255,255,255,0.04);font-weight:600;border-bottom:1px solid rgba(255,255,255,0.08)}
    .orders-table td{padding:12px;border-bottom:1px solid rgba(255,255,255,0.04)}
    .orders-table tbody tr:hover{background:rgba(255,255,255,0.02)}
    .badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:0.85rem;font-weight:600}
    .badge.buy{background:#28a745;color:#fff}
    .badge.sell{background:#dc3545;color:#fff}
    .empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="logo.png" class="logo" alt="Sand Box logo" />
      </div>
      <nav class="nav">
        <a href="/dashboard" class="nav-item">Overview</a>
        <a href="/market" class="nav-item">Market</a>
        <a href="/portfolio" class="nav-item">Portfolio</a>
        <a href="/orders" class="nav-item active">Orders</a>
        <a href="/reports" class="nav-item">Reports</a>
        <a href="/profile" class="nav-item">Profile</a>
        <a href="#" class="nav-item" data-logout>Sign out</a>
      </nav>
      <button id="sidebarToggle" class="sidebar-toggle">⟨</button>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="left">
          <button id="menuToggle" class="icon-btn">☰</button>
          <h1 class="page-title">My Orders</h1>
        </div>
        <div class="right">
          <div class="user">
            <div class="user-name">Hi, <span id="userName">User</span></div>
          </div>
          <a href="/market" class="btn primary">Trade Now</a>
        </div>
      </header>

      <div class="orders-container">
        <div class="orders-table">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Action</th>
                <th>Ticker</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="ordersBody">
              <tr><td colspan="6" class="empty-state">Loading orders...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <footer class="site-footer">
        <small>© <span id="year"></span> Sand Box Investment Broker</small>
      </footer>
    </div>
  </div>

  <script src="/js/toast.js"></script>
  <script src="/js/loading.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/logout.js"></script>
  <script>
    (function() {
      'use strict';
      
      const user = auth.getUser();
      if (user) {
        document.getElementById('userName').textContent = user.name;
      }

      async function loadOrders() {
        try {
          const response = await auth.apiRequest('/api/orders');
          const data = await response.json();
          
          const tbody = document.getElementById('ordersBody');
          
          if (!data.orders || data.orders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No orders yet. Start trading to see your orders here.</td></tr>';
            return;
          }

          tbody.innerHTML = data.orders.map(order => {
            const date = new Date(order.createdAt || order.created_at);
            const action = order.action || 'buy';
            const ticker = order.ticker || 'N/A';
            const quantity = Math.abs(Number(order.quantity) || 0);
            const price = Number(order.price || 0);
            const total = Math.abs(Number(order.total) || (quantity * price));
            
            return `
              <tr>
                <td>${date.toLocaleString()}</td>
                <td><span class="badge ${action}">${action.toUpperCase()}</span></td>
                <td><strong>${ticker}</strong></td>
                <td>${quantity.toFixed(2)}</td>
                <td>$${price.toFixed(2)}</td>
                <td>$${total.toFixed(2)}</td>
              </tr>
            `;
          }).join('');
        } catch (err) {
          console.error('Failed to load orders:', err);
          toast.error('Failed to load orders');
          document.getElementById('ordersBody').innerHTML = '<tr><td colspan="6" class="empty-state">Failed to load orders. Please try again.</td></tr>';
        }
      }

      loadOrders();

      const sidebar = document.getElementById('sidebar');
      const sidebarToggle = document.getElementById('sidebarToggle');
      const menuToggle = document.getElementById('menuToggle');
      sidebarToggle && sidebarToggle.addEventListener('click', () => sidebar.classList.toggle('collapsed'));
      menuToggle && menuToggle.addEventListener('click', () => sidebar.classList.toggle('collapsed'));

      document.getElementById('year').textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
