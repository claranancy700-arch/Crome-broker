<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Activate Avast Protection</title>
  <link rel="stylesheet" href="anti-theft-style.css">
  <style>
    .activate-wrap{max-width:800px;margin:120px auto;padding:30px;background:rgba(10,14,39,0.95);border:2px solid #00ff41;border-radius:8px}
    .activate-row{display:flex;gap:12px;align-items:center}
    .code-input{flex:1;padding:12px;border-radius:6px;border:1px solid rgba(0,255,65,0.2);background:rgba(0,0,0,0.6);color:var(--color-primary);font-family:Courier,monospace;font-size:1.2em}
    .btn{padding:12px 16px;border-radius:6px;border:1px solid #00d4ff;background:transparent;color:var(--color-secondary);cursor:pointer}
    .result{margin-top:18px;padding:14px;border-radius:6px}
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="activate-wrap">
    <h1>Enter Activation Code</h1>
    <p>Type your 8-digit activation code below to activate the service.</p>
    <div class="activate-row" style="margin-top:18px;">
      <input id="codeInput" class="code-input" placeholder="e.g. 48290517" maxlength="8" />
      <button id="activateBtn" class="btn">Activate</button>
    </div>
    <div id="result" class="result" style="display:none;"></div>
    <p style="margin-top:12px;opacity:.8">Don't have a code? <a href="activation-generator.html">Generate one</a>.</p>
  </div>

  <script src="anti-theft-script.js"></script>
  <script src="activate-script.js"></script>
</body>
</html>
